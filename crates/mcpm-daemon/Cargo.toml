[package]
name = "mcpm-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mcpm_daemon"
path = "src/lib.rs"

[[bin]]
name = "mcpm-fake-mcp"
path = "src/bin/fake_mcp.rs"
test = false

[dependencies]
mcpm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "io-std", "sync", "time", "macros", "signal"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"
